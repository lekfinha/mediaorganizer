[package]
name = "media-organizer"
version = "0.1.0"
description = "A fast multimedia file classifier desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "media_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

[profile.release]
opt-level = 2    # standard optimizations — safe with rustc 1.97.x on Linux
lto = false      # LTO disabled: triggers SIGSEGV/CFI bugs in this rustc/LLVM combo
strip = true
codegen-units = 16
